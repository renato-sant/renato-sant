name: Cobrinha das contribuições

on:
  schedule:
    - cron: "0 3 * * *"   # todo dia às 00:00 (horário de Brasília)
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  gerar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Gerar a animação
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/cobrinha-escuro.svg?palette=github-dark&color_snake=#d97757&color_dots=#1e1433,#3b1f6e,#5a2e9f,#8a5cd6,#c9a6ff
            dist/cobrinha-claro.svg?color_snake=#d97757&color_dots=#ebe5f5,#c9a6ff,#8a5cd6,#5a2e9f,#3b1f6e

      - name: Publicar no branch output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
